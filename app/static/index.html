<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mannele - relationship notebook</title>
  <meta name="description" content="A private notebook for the people in your life.">
  <meta name="theme-color" content="#f08a1c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="wrap">
  <header id="hd" hidden>
    <div class="hd-top">
      <a class="logo" href="#/"><span class="logo-word">Mannele</span><span class="logo-sub">まんねれ ― relationship notebook</span></a>
      <ul class="hd-links">
        <li id="today-label"></li>
        <li><a href="#/settings">Settings</a></li>
        <li><a href="#/settings">Backup</a></li>
        <li id="logout-item" hidden><a href="#" data-action="logout">Log out</a></li>
      </ul>
    </div>
    <nav id="gnav">
      <ul id="nav">
        <li data-nav="home"><a href="#/">Home</a></li>
        <li data-nav="people"><a href="#/people">People</a></li>
        <li data-nav="web"><a href="#/web">Relationship chart</a></li>
        <li data-nav="calendar"><a href="#/calendar">Calendar</a></li>
        <li data-nav="settings"><a href="#/settings">Settings</a></li>
      </ul>
      <form class="search" id="search-form" role="search">
        <input id="search-input" type="search" placeholder="Search notes" aria-label="Search" autocomplete="off">
        <button type="submit" class="btn">Search</button>
      </form>
      <button class="btn orange jot" data-action="quick-jot">+ Jot down</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer id="ft" hidden>
    <p class="ft-links"><a href="#/">Home</a> | <a href="#/people">People</a> | <a href="#/calendar">Calendar</a> | <a href="#/settings">Backup &amp; settings</a> | <a href="#" data-action="page-top">Page top ▲</a></p>
    <p class="copy">Copyright &copy; Mannele. Your data is stored only on this machine.</p>
  </footer>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" data-action="close-modal" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/avatar.js"></script>
<script src="/app.js"></script>
</body>
</html>
